spring.application.name=elearning
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toeic_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:xuantruong123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:ElearningToeicPlatformSecretKey2026Secure123456}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

app.upload-dir=${UPLOAD_DIR:${user.home}/toeic-path-data/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.sql.init.mode=never

# Tài khoản nhận tiền mặc định: chỉ dùng để tạo dòng payment_settings đầu tiên khi bảng còn trống.
app.payment.bank-bin=${PAYMENT_BANK_BIN:}
app.payment.bank-name=${PAYMENT_BANK_NAME:}
app.payment.account-no=${PAYMENT_ACCOUNT_NO:}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:}
