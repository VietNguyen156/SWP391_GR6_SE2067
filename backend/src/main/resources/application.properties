spring.application.name=elearning
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toeic_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-env-file-0123456789}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Chỉ khi chưa cấu hình SMTP: true thì mã OTP được in ra log để dev thử (không bao giờ trả trong response HTTP).
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}
# Khóa HMAC băm mã OTP đặt lại mật khẩu. Giá trị mặc định chỉ dùng khi dev; môi trường thật phải đặt RESET_CODE_SECRET riêng.
app.auth.reset-code-secret=${RESET_CODE_SECRET:dev-only-reset-code-secret-change-me}

# Gửi email (mã OTP quên mật khẩu). MAIL_USERNAME rỗng = chưa cấu hình, backend không gửi mail.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

app.upload-dir=${UPLOAD_DIR:${user.home}/toeic-path-data/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.sql.init.mode=never

# Tài khoản nhận tiền mặc định: chỉ dùng để tạo dòng payment_settings đầu tiên khi bảng còn trống.
app.payment.bank-bin=${PAYMENT_BANK_BIN:}
app.payment.bank-name=${PAYMENT_BANK_NAME:}
app.payment.account-no=${PAYMENT_ACCOUNT_NO:}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:}
